[dependencies]
digest = { version = "0.11", default-features = false, features = ["mac"] }
group = { version = "0.14", default-features = false }
ripemd = { version = "0.2", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2"

[dependencies.educe]
default-features = false
features = ["Debug", "Eq", "PartialEq"]
version = "0.7"

[dev-dependencies]
anyhow = "1.0.104"
bitcoin = "0.32"
ed25519-bip32 = "0.4.3"
hmac = { version = "0.13.0" }
num-bigint = { version = "0.4", default-features = false }

[dev-dependencies.curve25519-dalek]
default-features = false
features = ["group"]
version = "5.0.0"

[dev-dependencies.k256]
default-features = false
features = ["arithmetic"]
version = "0.14.0"

[features]
alloc = []
default = ["std"]
std = ["alloc"]

[lints.clippy]
all = { level = "deny", priority = -1 }
assertions_on_result_states = "allow"
let_unit_value = "allow"
wildcard_imports = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rust]
let_underscore_drop = "deny"

[package]
authors = ["Ash Manning <10554686+A-Manning@users.noreply.github.com>"]
description = "BIP32 and Ed25519-Bip32 compatible scheme for arbitrary prime-order groups"
edition = "2024"
name = "bip32ish"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/A-Manning/bip32ish"
rust-version = "1.85.0"
version = "0.1.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
